<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Update Profile</title>
        <style>
            #updateProfileDiv {
                background: white;
                width: 350px;
                margin: 50px auto;
                padding: 20px;
                border-radius: 10px;
            }

            header {
                background-color: #1f3a5f;
                padding: 12px 20px;
            }

            nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }

            
            #welcomeUser {
                color: #ffffff;
                font-weight: bold;
                margin-right: 15px;
            }

            
            nav a {
                color: #ffffff;
                text-decoration: none;
                margin: 8px 12px;
                font-weight: 500;
            }

            nav a:hover {
                text-decoration: underline;
            }

            
            #logoutButton {
                background-color: #ffffff;
                color: #1f3a5f;
                border: none;
                padding: 8px 14px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            #logoutButton:hover {
                background-color: #e0e0e0;
            }


        </style>
    </head>
    <body>
        <div id="headDIV">
                <header>
                    <nav>
                        <span id="welcomeUser"> </span>
                        <a href="home.html">Home</a> 
                        <a href="allflats.html">All Flats</a> 
                        <a href="newflats.html">New Flats</a>
                        <a href="updateprofile.html">Update Profile</a>
                        <button onclick="logOut()" id="logoutButton">Logout</button>
                    </nav>
                </header>

        </div>
        <div id="updateProfileDiv">
            <form id="updateProfileForm">
                <h2>Update Profile</h2>
                <input type="text" id="firstName" placeholder="First Name"><br><br>
                <input type="text" id="lastName" placeholder="Last Name"><br><br>
                <input type="date" id="birthDate"><br><br>

                <button type="submit" id="updateProfileButton">Update Profile</button><br><br>
            </form>
            <p id="updateMessage"></p>
        </div>
        <script src="updateprofile.js"></script>
    </body>
    
</html>
