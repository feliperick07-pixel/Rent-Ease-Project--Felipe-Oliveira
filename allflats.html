<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>All Flats</title>
        <link rel="icon" type="image/x-icon" href="Images/LogoRR.png">
        <style>
            table {
                width: 95%;
                margin: auto;
                border-collapse: collapse;
                background: white;
            }

            th {
                background: #1f3a5f;
                color: white;
                padding: 10px;
            }

            td {
                padding: 8px;
                text-align: center;
            }

            button {
                cursor: pointer;
                border: none;
                background: transparent;
                font-size: 18px;
            }

            header {
                background-color: #1f3a5f;
                padding: 12px 20px;
            }

            nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }

            
            #welcomeUser {
                color: #ffffff;
                font-weight: bold;
                margin-right: 15px;
            }

            
            nav a {
                color: #ffffff;
                text-decoration: none;
                margin: 8px 12px;
                font-weight: 500;
            }

            nav a:hover {
                text-decoration: underline;
            }

            
            #logoutButton {
                background-color: #ffffff;
                color: #1f3a5f;
                border: none;
                padding: 8px 14px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            #logoutButton:hover {
                background-color: #e0e0e0;
            }
            #filter {
                text-align: center;
                margin: 20px;
            }

        </style>
    </head>
    <body>
        <div id="headDIV">
            <header>
                <nav>
                    <span id="welcomeUser"> </span>
                    <a href="home.html">Home</a> 
                    <a href="allflats.html">All Flats</a> 
                    <a href="newflats.html">New Flats</a>
                    <a href="updateprofile.html">Update Profile</a>
                    <button onclick="logOut()" id="logoutButton">Logout</button>
                </nav>
            </header>
        </div>   
        <div id="allflats">
            <h2>All Available Flats</h2>
            <div id="filter">
                <select id="sortPrice"> 
                    <option value="">Sort by Price</option>
                    <option value="asc">Low to High</option>
                    <option value="desc">High to Low</option>
                </select>

                <select id="filterAC">
                    <option value="">Filter by AC</option>
                    <option value="yes">Has AC</option>
                    <option value="no">No AC</option>
                </select>

                <input type="text" id="filterCity" placeholder="Filter by City">
                <button id="filterButton">Filter</button>
                <button id="clearButton">Clear Filter</button>
            </div>
            <div id="flatsContainer">
                <table  border="1">
                    <thead>
                        <tr>
                            <th>City</th>
                            <th>Street Name</th>
                            <th>Street Number</th>
                            <th>Area Size (sqm)</th>
                            <th>Has AC</th>
                            <th>Year Built</th>
                            <th>Rental Price (per month)</th>
                            <th>Date Available</th>
                        </tr>
                    </thead>
                    <tbody id="flatsTable">
                        
                    </tbody>
                </table>
            </div>
                
                
        </div>
        <script src="allflats.js"></script>
    </body>


</html>
