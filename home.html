<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rick Rental - Home</title>
        <link rel="icon" type="image/x-icon" href="Images/LogoRR.png">
        <style>
            body {
                background: #f4f6f8;
                font-family: Arial;
            }

            #favoritesSection div {
                background: white;
                border-left: 5px solid #1f3a5f;
                padding: 15px;
                margin: 15px;
                border-radius: 6px;
            }

            
            header {
                background-color: #1f3a5f;
                padding: 12px 20px;
            }

                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }

            
            #welcomeUser {
                color: #ffffff;
                font-weight: bold;
                margin-right: 15px;
            }

            
            nav a {
                color: #ffffff;
                text-decoration: none;
                margin: 8px 12px;
                font-weight: 500;
            }

            nav a:hover {
                text-decoration: underline;
            }

            
            #logoutButton {
                background-color: #ffffff;
                color: #1f3a5f;
                border: none;
                padding: 8px 14px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            #logoutButton:hover {
                background-color: #e0e0e0;
            }

            #favoritesSection {
                width: 80%;
                margin: 20px auto;
                padding: 20px;
                background: #ffffff;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }

    <body>
        <div id="headDIV">
            <header>
                <nav>
                    <span id="welcomeUser"> </span>
                    <a href="home.html">Home</a>

            <p></p>
         </div>
