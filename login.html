<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rick Rental - Login</title>
        <link rel="icon" type="image/x-icon" href="Images/LogoRR.png">
        <style>
            body {
                background: #011e3acb;
                font-family: Arial, sans-serif;
            }

            #LoginDIV {
                background: rgb(255, 255, 255);
                width: 320px;
                margin: 80px auto;
                padding: 25px;
                border-radius: 10px;
                text-align: center;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                color: #16304a;
            }

            input, button {
                width: 100%;
                padding: auto;
                margin-top: 10px;
            }

            button {
                background: #1f3a5f;
                color: white;
                border: none;
                cursor: pointer;
                font-size: 16px;
            }

            button:hover {
                background: #16304a;
            }

        </style>
    </head>

    <body>
        <div id="LoginDIV">
            <h1>Login</h1>
            <img src="Images/LogoRR.png" height="325" width="325" alt="Logo"> <br>
            <form id="LoginInfo">   
                <input type="text" id="email" name="email" placeholder="E-mail"><br>
                <input type="password" id="password" name="password" placeholder="Password"><br>
                <button id="loginButton" type="submit">Login</button><br><br>
            </form>
            <p id="errorMessage"></p>
            <a href="register.html">Don't have an account? Click here to register!</a><br><br>
        </div>

        <script src="login.js"></script>
    </body>
</html>
