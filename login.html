<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rick Rental - Login</title>
        <link rel="icon" type="image/x-icon" href="Images/LogoRR.png">
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                margin: 10;
                padding: 10;
               
            }

            #LoginDIV {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 5px;
                width: 300px;
                margin: auto ;
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
            }

            h1 {
                color: #62685a;
                align-items: center;
                margin-top: 10px;
            }
        </style>
    </head>

    <body>
        <div id="LoginDIV">
            <h1>Login</h1>
            <img src="Images/LogoRR.png" height="325" width="325" alt="Logo"> <br>
            <form id="LoginInfo">   
                <input type="text" id="email" name="email" placeholder="E-mail"><br><br>
                <input type="password" id="password" name="password" placeholder="Password"><br><br>
                <button id="loginButton" type="submit">Login</button><br><br>
            </form>
            <p id="errorMessage"></p>
            <a href="register.html">Don't have an account? Click here to register</a><br><br>
        </div>

        <script src="login.js"></script>
    </body>
</html>
