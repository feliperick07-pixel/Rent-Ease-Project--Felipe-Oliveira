<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rick Rental - Register</title>
        <link rel="icon" type="image/x-icon" href="Images/LogoRR.png">
        <style>
            body {
                background: #011e3acb;
                font-family: Arial;
            }

            #registerDiv {
                background: white;
                width: 350px;
                margin: 60px auto;
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                color: #1f3a5f;
                align-items: center;
            }

            input, button {
                width: 100%;
                height: 20px    ;
                padding: auto;
                margin-top:  10px;
            }

            button {
                background: #1f3a5f;
                color: white;
                border: none;
                cursor: pointer;
                font-size: 16px;
                height: 20px;


            }

        </style>
    </head>
    <body>
        <div id="registerDiv">
            <h1>Register</h1>
            <form id="registerInfo">
                <input type="text" id="firstName" name="firstName" placeholder="First Name"><br><br>
                <input type="text" id="lastName" name="lastName" placeholder="Last Name"><br><br>
                <input type="date" id="birthDate" name="birthDate" placeholder="Birth Date"><br><br>
                <input type="email" id="email" name="email" placeholder="E-mail"><br><br>
                <input type="password" id="password" name="password" placeholder="Password"><br><br>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"><br><br>
                <button id="registerButton" type="submit">Register</button><br><br>
            </form>
            <p id="error"></p>
            <a href="login.html">Already have an account? Click here to login</a><br><br>
        </div>

        <script src="register.js"></script>
    </body>
